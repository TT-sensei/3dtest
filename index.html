<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#b9e6f4">
  <title>ナビキャラと ちいさな3Dのまち</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="game" aria-label="ナビキャラと歩く3Dのまち">
    <div id="loading" role="status">まちを じゅんびしているよ…</div>
    <div class="topbar">
      <div class="brand"><span class="brand-dot"></span><span>ちいさな3Dのまち</span></div>
      <button id="changeGuide" class="soft-button" type="button">ナビキャラをかえる</button>
    </div>
    <div id="message" class="message" aria-live="polite">まちを あるいてみよう！</div>
    <div class="bottom-help">PC：WASD／矢印キー　・　タブレット：下のボタン</div>
    <div class="controls" aria-label="移動ボタン">
      <button class="move up" data-dir="up" aria-label="前へ">▲</button>
      <button class="move left" data-dir="left" aria-label="左へ">◀</button>
      <button class="move down" data-dir="down" aria-label="後ろへ">▼</button>
      <button class="move right" data-dir="right" aria-label="右へ">▶</button>
    </div>
    <button id="lookAround" class="look-button" type="button">まわりをみる</button>
    <div id="error" hidden></div>
  </main>
  <script src="vendor/three.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
